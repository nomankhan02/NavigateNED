name: Core C++ CI & WASM Build

on:
  push:
    paths:
      - 'core/**'
      - '.github/workflows/core.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Native Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure Native Build
        run: |
          cmake -B core/build-native -S core -G Ninja

      - name: Build & Run Native Tests
        run: |
          cmake --build core/build-native
          ctest --test-dir core/build-native --output-on-failure

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Configure & Build WASM
        run: |
          mkdir -p web/public/wasm
          emcmake cmake -B core/build-wasm -S core -G Ninja
          cmake --build core/build-wasm
          cp core/build-wasm/navcore.js web/public/wasm/navcore.js

      - name: Commit & Push WASM Artifact
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add web/public/wasm/navcore.js
          if git diff --staged --quiet; then
            echo "WASM output unchanged, skipping commit."
          else
            git commit -m "build(wasm): update compiled navcore.js artifact [skip ci]"
            git push
          fi
